[package]
name = "doppely"
version = "0.0.6"
edition = "2024"

[features]
default = ["lightyear/netcode", "lightyear/udp"]
cuda = ["dfdx/cuda"]

client = [
    "bevy/3d",
    "bevy/3d_bevy_render",
    "bevy/3d_api",
    "bevy/bevy_ui",
    "bevy/bevy_text",
    "bevy/bevy_ui_render",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_winit",
    "bevy/bevy_window",
    "bevy/default_font",
    "lightyear/client",
    "dep:bevy-react"
]

server = [
    "dep:dfdx",
    "lightyear/server",
    "dep:strum"
]

[dependencies]
serde = "1.0.229"
serde_json = "1.0"
ts-rs = "10.1.0"
clap = { version = "4.6.7", features = ["derive"] }

# Управление вводом для клиент-серверного взаимодействия
leafwing-input-manager = "0.22.0"

# Сетевая библиотека
lightyear = { version = "0.31.0", features = ["avian3d", "interpolation", "prediction", "replication", "leafwing"]}
lightyear_frame_interpolation = "0.31.0"

# Библиотека для нейронной сети
dfdx = { version = "0.13.0", optional = true }
strum = { version = "0.28.0", features = ["derive"], optional = true }
rand = "0.10.3"

# Библиотека для UI (React в Bevy)
bevy-react = { version = "0.8", optional = true }

# Движок для обработки логики игры и рендеринга
[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    "std",
    "bevy_state",
    "bevy_asset",
    "bevy_log"
]

# Движок физики в 3d
[dependencies.avian3d]
version = "0.8.0"
features = [
  "3d",
  "parry-f32",
  "parallel",
  "serialize",
]

[[bin]]
name = "client"
path = "src/client/mod.rs"
required-features = ["client"]

[[bin]]
name = "server"
path = "src/server/mod.rs"
required-features = ["server"]

[profile.production]
inherits = "release"
lto = "thin"
strip = true
codegen-units = 1
